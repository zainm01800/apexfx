name: paper-portfolio
# Repaired paper accounts only. Original tables and runtime IDs are archives.
on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch: {}
concurrency:
  group: legacy-paper-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://cuvchjhaojhmxfgczndy.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt
      - uses: actions/cache@v4
        with:
          path: engine/data_store/*.parquet
          key: paper-portfolio-data-${{ github.run_id }}
          restore-keys: paper-portfolio-data-
      - name: Verify repaired accounting and persistence
        working-directory: engine
        run: python -m pytest tests/test_repaired_paper_accounting.py tests/test_repaired_paper_runtime.py -q
      - name: Advance all six isolated paper accounts
        working-directory: engine
        # Each book is attempted independently. Any blocked book fails the run.
        # The runner cannot reseed or touch an original legacy ledger.
        run: python scripts/run_repaired_paper.py --book all
