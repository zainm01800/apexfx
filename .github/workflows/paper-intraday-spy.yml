name: SPY Intraday Forward Paper (V24 & V30)

on:
  schedule:
    # Settle after both summer/winter XNYS closes plus 30-minute grace.
    - cron: "15 22 * * 1-5"
    # Read-only until a new complete session is available; retry delayed feeds next morning.
    - cron: "15 8 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without writing to Supabase"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: paper-intraday-spy-global
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://cuvchjhaojhmxfgczndy.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r engine/requirements-forward.txt

      - name: Run unit tests
        run: python -m unittest engine/tests/test_intraday_forward.py

      - name: Step SPY Intraday Forward Books (V24 and V30)
        run: |
          FLAGS="--book all --step"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python3 engine/scripts/run_intraday_forward.py $FLAGS || {
            code=$?
            echo "::warning::SPY Intraday forward run held or blocked (exit $code); account state safely preserved."
          }

